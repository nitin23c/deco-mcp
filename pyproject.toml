[project]
name = "deco-mcp"
version = "0.2.0"
description = "MCP server for TP-Link Deco mesh routers: clients, DHCP reservations, status, reboot"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nitin Chauhan" }]
keywords = ["mcp", "model-context-protocol", "tplink", "deco", "router", "dhcp", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Topic :: Home Automation",
]
dependencies = [
    # Audited 2026-11-13 at commit 4125d72 (tag v2.1.1). Re-audit before bumping.
    "tplink-deco-api==2.1.1",
]

[project.scripts]
deco-mcp = "deco_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deco_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
